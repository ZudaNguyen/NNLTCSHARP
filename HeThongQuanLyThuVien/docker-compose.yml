
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: qltv-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - qltv_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  qltv_sql_data:
